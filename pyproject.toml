[project]
name = "md-to-single-html-ebook"
version = "0.1.0"
description = "把 Markdown 小说编译成自包含的单文件 HTML 电子书"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "playwright>=1.40",
    "ruff>=0.16.9",
]

[tool.uv]
package = false
# 锁文件源固定为官方 PyPI，且此处优先级高于本机 ~/AppData/Roaming/uv/uv.toml。
# 不加这一段时，本机全局 index-url 指向镜像，任何一次 `uv lock`（含 `uv run`
# 触发的隐式 relock）都会把 uv.lock 的 registry 整片改写成镜像源，境外 CI 拉镜像会 tcp 超时。
# 补上之后，本仓原先「本地 uv run 会整篇改写 uv.lock，提交前要 git restore」的坑随之消失。
# 注：`default-index` 字段 uv 0.11 不认（报 unknown field 并整体忽略该节），
# 必须用下面的 [[tool.uv.index]] 表。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]

[project]
name = "md-to-single-html-ebook"
version = "0.1.0"
description = "把 Markdown 小说编译成自包含的单文件 HTML 电子书"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
]

[dependency-groups]
dev = [
    "playwright>=1.40",
    "ruff>=0.16.9",
]

[tool.uv]
package = false

[tool.ruff]
# 不碰 Markdown 里嵌的 Python 片段：文档与笔记正文不属格式化范围
extend-exclude = ["*.md"]
